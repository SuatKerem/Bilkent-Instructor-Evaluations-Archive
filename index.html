<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bilkent Instructor &amp; Course Guide</title>
<script>
  // Match the OS/browser color-scheme preference at startup, before first
  // paint (so there's no flash of the wrong theme). Runs once on load;
  // the toggle button still lets the person override it for the session.
  (function () {
    try {
      var wantsDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", wantsDark ? "dark" : "light");
    } catch (e) { /* keep the light default */ }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="hero-wrap">
  <div class="hero">
    <button id="themeToggle" class="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
    <div class="seal" aria-hidden="true">
      <svg width="50" height="50" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="46" stroke="currentColor" stroke-width="2.5"/>
        <circle cx="50" cy="50" r="37" stroke="currentColor" stroke-width="1.2"/>
        <g stroke="currentColor" stroke-width="2">
          <line x1="50" y1="4" x2="50" y2="11"/>
          <line x1="50" y1="89" x2="50" y2="96"/>
          <line x1="4" y1="50" x2="11" y2="50"/>
          <line x1="89" y1="50" x2="96" y2="50"/>
          <line x1="17" y1="17" x2="22" y2="22"/>
          <line x1="78" y1="78" x2="83" y2="83"/>
          <line x1="17" y1="83" x2="22" y2="78"/>
          <line x1="78" y1="22" x2="83" y2="17"/>
        </g>
        <text x="50" y="61" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="34" font-weight="600" fill="currentColor">B</text>
      </svg>
    </div>
    <h1>Bilkent Instructor &amp; Course Guide</h1>
    <p class="tagline">Find who to take, straight from what students actually said.</p>
    <div id="statsBar" class="stats-row"></div>
  </div>
</div>

<div class="wrap">

  <!-- Ad slot: top banner. Non-intrusive, clearly labeled, no popups/overlays.
       Replace this div's contents with your ad network's snippet (e.g. an
       AdSense <ins> tag) when ready. -->
  <div class="ad-slot banner">Advertisement</div>

  <div class="filters">
    <div class="filters-grid">
      <div class="field">
        <label for="deptSelect">Department</label>
        <select id="deptSelect">
          <option value="">All departments</option>
        </select>
      </div>
      <div class="field">
        <label for="courseSelect">Course</label>
        <select id="courseSelect" disabled>
          <option value="">Select a department first</option>
        </select>
      </div>
      <div class="field">
        <label for="search">Search name or course code</label>
        <input type="text" id="search" placeholder="e.g. &quot;Tarık Kara&quot; or &quot;ECON 101&quot;" />
      </div>
      <div class="field">
        <label for="minResponses">Minimum responses</label>
        <select id="minResponses">
          <option value="0">Any</option>
          <option value="5">5+</option>
          <option value="10">10+</option>
          <option value="20">20+</option>
          <option value="50">50+</option>
        </select>
      </div>
    </div>
    <div class="filters-row2">
      <div class="field" style="min-width:220px;">
        <label for="sortBy">Sort by</label>
        <select id="sortBy">
          <option value="rating-desc">Rating (high to low)</option>
          <option value="rating-asc">Rating (low to high)</option>
          <option value="responses-desc">Most responses</option>
          <option value="evals-desc">Most sections evaluated</option>
          <option value="name-asc">Name (A–Z)</option>
          <optgroup label="By specific criteria">
            <option value="q8-desc">Teaching effectiveness</option>
            <option value="q1-desc">Clarity of expectations</option>
            <option value="q2-desc">Stimulates interest</option>
            <option value="q3-desc">Class participation</option>
            <option value="q4-desc">Critical thinking</option>
            <option value="q5-desc">Mutual respect</option>
            <option value="q6-desc">Punctuality</option>
            <option value="q9-desc">How much students learned</option>
            <option value="q10-desc">Assignment rigor</option>
          </optgroup>
        </select>
      </div>
      <div style="display:flex; gap:10px; align-items:center;">
        <button id="clearFilters" class="link-btn">Clear filters</button>
        <button id="exportCsv" class="small-btn">⬇ Export results as CSV</button>
      </div>
    </div>
  </div>

  <div id="resultsInfo" class="results-info"></div>
  <div id="grid" class="grid">
    <div class="empty-state"><span class="spinner"></span><h3 style="margin-top:14px;">Loading…</h3></div>
  </div>

  <footer class="site-footer">
    Data source: Bilkent University STARS public course &amp; instructor evaluation reports.
    <span id="genAt"></span><br />
    Built for personal course-selection use — not an official Bilkent University resource.
  </footer>

</div>

<div id="modalOverlay" class="modal-overlay">
  <div class="modal">
    <div id="modalBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
